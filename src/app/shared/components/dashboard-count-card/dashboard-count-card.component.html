<div class="card-main" *ngIf="!iconClass;else iconCard">

  <div class="value" [style]="{'color': valueColor}">
    {{ value }}
  </div>

  <div class="label" [style]="{'color': labelColor}">
    {{ label }}
  </div>
</div>

<ng-template #iconCard>
  <div class="card" (click)="cardClick.emit()">

    <div class="icon-bubble" [style.background-color]="iconBgColor">
      <i [class]="iconClass" [style.color]="iconColor"></i>
    </div>

    <div class="card-content">
      <span class="label" [style.color]="labelColor">{{ label }}</span>
      <span class="value" [style.color]="valueColor">{{ value }}</span>
      <span class="bottom-text" *ngIf="bottomText" [style.color]="bottomTextColor">
        <i *ngIf="trend" class="fa-solid" [class.fa-arrow-up]="trend === 'up'"
          [class.fa-arrow-down]="trend === 'down'" [style.color]="trendColor"></i>
        {{ bottomText }}
      </span>

      <app-sparkline
        class="card-sparkline"
        *ngIf="sparklineData?.length"
        [data]="sparklineData!"
        [color]="sparklineColor"
        [width]="120"
        [height]="24"
        [filled]="true"
      />
    </div>

  </div>
</ng-template>
