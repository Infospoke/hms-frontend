<div class="approval-component">

  <app-approval-layout
    [heading]="'Approval Chain Configuration'"
    subHeading="Create and manage multi-level approval workflows"
    [showInfo]="true"
    infoTooltip="Manage approval chains"
    [cards]="cards"
    [dropDownData]="dropDownData"
    [searchPlaceholder]="'Search by chain name...'"
    (handle)="onCreate()"
    [showBtn]="true"
    [buttonType]="'Create Chain'"
    (filterChange)="filtersResponse($event)"
    [tabs]="tabs"
    (tabChange)="setTab($event)"
    [activeTab]="activeTab"
    >
    
  </app-approval-layout>

  <div class="card-dd">
    <app-reusable-table
      [columns]="columns"
      [data]="data"
      [totalItems]="totalItems"
      [pageSize]="pageSize"
      [currentPage]="currentPage"
      [cellTemplate]="cellTpl"
      emptyMessage="No approval chains found."
      (pageChange)="onPageChange($event)">
    </app-reusable-table>
  </div>

</div>

<ng-template #cellTpl let-ctx>

  <!-- Chain Name + description + icon -->
  <ng-container *ngIf="ctx.col.key === 'chainName'">
    <div class="chain-name-cell">
      <div class="chain-icon"
        [style.background]="ctx.row.iconBgColor"
        [style.color]="ctx.row.iconColor">
        <i [class]="ctx.row.iconClass"></i>
      </div>
      <div class="chain-name-body">
        <span class="chain-name-text">{{ ctx.row.chainName }}</span>
        <span class="chain-desc">{{ ctx.row.description }}</span>
      </div>
    </div>
  </ng-container>

  <!-- Levels — numbered pills -->
  <ng-container *ngIf="ctx.col.key === 'levels'">
    <div class="level-badges">
      <span class="level-badge" >{{ ctx.row.levels }}</span>
    </div>
  </ng-container>

  <!-- Last Updated -->
  <ng-container *ngIf="ctx.col.key === 'lastUpdated'">
    <div class="last-updated-cell">
      <span class="last-updated-date">{{ ctx.row.lastUpdated |date:'dd MMM yyyy' }}</span>
      <span class="last-updated-by">by {{ ctx.row.updatedBy }}</span>
    </div>
  </ng-container>

  <!-- Status badge -->
  <ng-container *ngIf="ctx.col.key === 'status'">
    <span class="status-badge"
      [ngClass]="ctx.row.status === 'Active' ? 'active' : 'deactivated'">
      {{ ctx.row.status }}
    </span>
  </ng-container>

  <!-- Actions -->
  <ng-container *ngIf="ctx.col.key === 'actions'">
    <app-common-table-actions
      (view)="onView(ctx.row)"
      (edit)="onEdit(ctx.row)"
      viewPermission="SYSTEM&ADMINS:APPROVALCHAINCONFIGURATION:VIEW"
      editPermission="SYSTEM&ADMINS:APPROVALCHAINCONFIGURATION:EDIT"/>
  </ng-container>

</ng-template>
