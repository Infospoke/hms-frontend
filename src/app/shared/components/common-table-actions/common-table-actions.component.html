<div class="actions-cell">

  <button class="action-btn view-btn" [title]="isCreate? 'Create' :'View'" (click)="view.emit()" *appCan="viewPermission">
    <i [class]="isCreate
        ? 'fa-solid fa-plus'
        : 'fa-regular fa-eye'">
    </i>

  </button>

  <button class="action-btn edit-btn" title="Edit" (click)="edit.emit()" *appCan="editPermission" [disabled]="editDisabled">
    <i class="fa-solid fa-pencil"></i>
  </button>

</div>
