<div class="cr-page" [class.cr-page--view]="viewMode">

  <!-- ── Configure Rounds section ────────────────────────────────────────── -->
  <section class="cr-section">
    <div class="cr-section__header">
      <div class="cr-section__title-group">
        <div class="cr-section__icon">
          <i class="fas fa-circle-nodes"></i>
        </div>
        <div>
          <h3 class="cr-section__title">Configure Rounds</h3>
          <p class="cr-section__sub">Define the sequence of rounds and their settings.</p>
        </div>
      </div>
      <div class="cr-header-right">
        <span class="cr-round-counter" [class.cr-round-counter--max]="rounds.length >= maxRounds">
          <i class="fas fa-layer-group"></i>
          {{ rounds.length }} / {{ maxRounds }} rounds
        </span>
        <button
          class="cr-btn cr-btn--outline"
          (click)="addRound()"
          [disabled]="rounds.length >= maxRounds"
          [title]="rounds.length >= maxRounds ? 'Maximum 4 rounds allowed' : 'Add a new round'"
        >
          <i class="fas fa-plus"></i> Add Round
        </button>
      </div>
    </div>

    <!-- Max rounds notice -->
    

    <!-- Table header -->
    <div class="cr-table">
      <div class="cr-table__head">
        <div class="cr-col cr-col--drag" *ngIf="!viewMode"></div>
        <div class="cr-col cr-col--order">Order</div>
        <div class="cr-col cr-col--stage">Stage Name <span class="cr-required">*</span></div>
        <div class="cr-col cr-col--type">Stage Type <span class="cr-required">*</span></div>
        <div class="cr-col cr-col--mode">Interview Mode <span class="cr-required">*</span></div>
        <div class="cr-col cr-col--mandatory">Mandatory</div>
        <div class="cr-col cr-col--actions" *ngIf="!viewMode">Actions</div>
      </div>

      <!-- Rows -->
      <div class="cr-table__body">
        <div
          *ngFor="let round of rounds; let i = index"
          class="cr-row"
          [class.cr-row--dragging]="!viewMode && dragIndex === i"
          [class.cr-row--dragover]="!viewMode && dragOverIndex === i && dragIndex !== i"
          [class.cr-row--locked]="isDefaultRound(round)"
          [draggable]="!viewMode && !isDefaultRound(round)"
          (dragstart)="!viewMode && onDragStart(i)"
          (dragover)="!viewMode && onDragOver($event, i)"
          (drop)="!viewMode && onDrop($event, i)"
          (dragend)="!viewMode && onDragEnd()"
        >
          <!-- Drag handle (hidden in view mode via CSS; disabled for the fixed default round) -->
          <div class="cr-col cr-col--drag">
            <span
              class="cr-drag-handle"
              [class.cr-drag-handle--disabled]="isDefaultRound(round)"
              [title]="isDefaultRound(round) ? 'This round is fixed as the first round' : 'Drag to reorder'"
            >
              <i class="fas fa-grip-vertical"></i>
            </span>
          </div>

          <!-- Order badge -->
          <div class="cr-col cr-col--order">
            <span class="cr-order-badge">{{ round.order || i + 1 }}</span>
          </div>

          <!-- Stage Name -->
          <div class="cr-col cr-col--stage">
            <input
              class="cr-input"
              type="text"
              [(ngModel)]="round.stageName"
              placeholder="Stage name"
            />
          </div>

          <!-- Stage Type -->
          <div class="cr-col cr-col--type">
            <!-- View/Edit mode: data already has the stage type *name* (no id), show it directly -->
            <input
              *ngIf="viewMode"
              class="cr-input"
              type="text"
              [value]="round.stageType"
              readonly
            />

            <!-- Create mode: dropdown bound to stage type ids -->
            <div class="cr-select-wrap" *ngIf="!viewMode">
              <select
                class="cr-select"
                [(ngModel)]="round.stageType"
                [disabled]="isDefaultRound(round)"
                [class.cr-select--placeholder]="!round.stageType"
                [title]="isDefaultRound(round) ? 'Stage type is fixed for the default AI Interview round' : ''"
              >
                <option value="" disabled hidden>Select stage type</option>
                <option
                  *ngFor="let opt of getAvailableStageTypes(round)"
                  [value]="opt.id"
                  [disabled]="opt.disabled"
                  [class.cr-option--disabled]="opt.disabled"
                >
                  {{ opt.name }}
                </option>
              </select>
              <i class="fas fa-chevron-down cr-select-arrow"></i>
            </div>
          </div>

          <!-- Interview Mode -->
          <div class="cr-col cr-col--mode">
            <div class="cr-select-wrap">
              <select
                class="cr-select"
                [(ngModel)]="round.interviewMode"
                [disabled]="isDefaultRound(round)"
                [title]="isDefaultRound(round) ? 'Interview mode is fixed for the default AI Interview round' : ''"
              >
                <option *ngFor="let opt of interviewModeOptions" [value]="opt">{{ opt }}</option>
              </select>
              <i class="fas fa-chevron-down cr-select-arrow"></i>
            </div>
          </div>

          <!-- Mandatory toggle -->
          <div class="cr-col cr-col--mandatory">
            <label
              class="cr-toggle"
              [class.cr-toggle--on]="round.mandatory"
              [class.cr-toggle--disabled]="isDefaultRound(round)"
              [title]="isDefaultRound(round) ? 'The AI Interview round is always mandatory' : ''"
            >
              <input type="checkbox" [(ngModel)]="round.mandatory" [disabled]="isDefaultRound(round)" />
              <span class="cr-toggle__track">
                <span class="cr-toggle__thumb"></span>
              </span>
            </label>
          </div>

          <!-- Delete -->
          <div class="cr-col cr-col--actions" *ngIf="!viewMode">
            <button
              class="cr-delete-btn"
              (click)="deleteRound(i)"
              [disabled]="isDefaultRound(round)"
              [title]="isDefaultRound(round) ? 'The default AI Interview round cannot be removed' : 'Remove round'"
            >
              <i class="fas fa-trash-can"></i>
            </button>
          </div>
        </div>

        <!-- Empty state -->
        <div *ngIf="rounds.length === 0" class="cr-empty">
          <i class="fas fa-inbox cr-empty__icon"></i>
          <p>No rounds added yet. Click <strong>+ Add Round</strong> to begin.</p>
        </div>
      </div>
    </div>
  </section>

  <!-- ── Footer actions ───────────────────────────────────────────────────── -->
  <div class="cr-footer" *ngIf="!viewMode">
    <button class="cr-btn cr-btn--ghost" (click)="onDiscard()">
      <i class="fas fa-xmark"></i> Cancel
    </button>
    <button class="cr-btn cr-btn--primary" (click)="onSave()">
      <i class="fas fa-floppy-disk"></i> Save Plan
    </button>
  </div>
