  <!-- ── Reusable table ────────────────────────────────────────────────────── -->
  <app-reusable-table
  [title]="'Today Interviews'"
    [columns]="columns"
    [data]="interviews"
    [showPagination]="showPagination"
    [currentPage]="currentPage"
    [pageSize]="pageSize"
    [totalItems]="totalItems"
    [cellTemplate]="todayCell"
    emptyMessage="No interviews scheduled for today."
    (rowClick)="onRowClick($event)"
    (pageChange)="onPageChange($event)">
  </app-reusable-table>

</div>

<!-- ── Cell template ──────────────────────────────────────────────────────── -->
<!-- context: { $implicit: { row: TodayInterview, col: TableColumn } }        -->
<ng-template #todayCell let-ctx>

  <!-- TIME -->
  <ng-container *ngIf="ctx.col.key === 'time'">
    <span class="ti-time">{{ ctx.row.time }}</span>
  </ng-container>

  <!-- CANDIDATE -->
  <ng-container *ngIf="ctx.col.key === 'candidate'">
    <div class="ti-candidate">
      <div class="ti-avatar">{{ ctx.row.initials }}</div>
      <div class="ti-candidate__info">
        <span class="ti-candidate__name">{{ ctx.row.name }}</span>
        <span class="ti-candidate__id">{{ ctx.row.id }}</span>
      </div>
    </div>
  </ng-container>

  <!-- JOB TITLE -->
  <ng-container *ngIf="ctx.col.key === 'jobTitle'">
    <div class="ti-job">
      <span class="ti-job__title">{{ ctx.row.jobTitle }}</span>
      <span class="ti-job__dept">{{ ctx.row.department }}</span>
    </div>
  </ng-container>

  <!-- ROUND -->
  <ng-container *ngIf="ctx.col.key === 'round'">
    <span class="ti-round">{{ ctx.row.round }}</span>
  </ng-container>

  <!-- TYPE -->
  <ng-container *ngIf="ctx.col.key === 'type'">
    <span class="ti-type-badge" [ngClass]="typeBadgeClass(ctx.row.type)">
      {{ ctx.row.type }}
    </span>
  </ng-container>

  <!-- ACTION -->
  <ng-container *ngIf="ctx.col.key === 'action'">
    <div class="ti-action" (click)="$event.stopPropagation()">
      <button
        class="ti-btn-view"
        type="button"
        (click)="onViewDetails(ctx.row)"
        [attr.aria-label]="'View details for ' + ctx.row.name">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>
        </svg>
        View Details
      </button>
      
    </div>
  </ng-container>

</ng-template>
