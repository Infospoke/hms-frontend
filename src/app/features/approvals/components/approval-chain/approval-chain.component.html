<div class="approval-component">

  <app-approval-layout [heading]="'Approval of Chains'" subHeading="Review and approve pending chains" [showInfo]="true"
    infoTooltip="Manage approval chains" [cards]="cards" [searchPlaceholder]="'Search by chain name...'"
    (filterChange)="filtersResponse($event)" [dropDownData]="dropDownData" [tabs]="tabs" (tabChange)="setTab($event)" [activeTab]="activeTab">
  </app-approval-layout>

  

  <!-- ── Table ── -->
  <div class="card-dd">
    <app-reusable-table [columns]="columns" [data]="filteredData" [totalItems]="totalItems" [pageSize]="pageSize"
      [currentPage]="currentPage" [cellTemplate]="cellTpl" emptyMessage="No approval chains found."
      (pageChange)="onPageChange($event)">
    </app-reusable-table>
  </div>

</div>

<!-- ── Custom cell template ── -->
<ng-template #cellTpl let-ctx>

  <!-- Chain Name with icon -->
  <ng-container *ngIf="ctx.col.key === 'chainName'">
    <div class="chain-name-cell">
      <div class="chain-icon" [style.background]="ctx.row.iconBgColor" [style.color]="ctx.row.iconColor">
        <i [class]="ctx.row.iconClass"></i>
      </div>
      <span class="chain-name-text">{{ ctx.row.chainName }}</span>
    </div>
  </ng-container>

  <!-- Description -->
  <ng-container *ngIf="ctx.col.key === 'description'">
    <span class="chain-desc-cell">{{ ctx.row.description }}</span>
  </ng-container>

  <!-- Levels -->
  <ng-container *ngIf="ctx.col.key === 'levels'">
    <span class="level-badge">{{ ctx.row.levels }}</span>
  </ng-container>

  <!-- Created On -->
  <ng-container *ngIf="ctx.col.key === 'createdOn'">
    <div class="date-cell">
      <span class="date-cell__date">{{ ctx.row.createdOnDate }}</span>
      <span class="date-cell__time">{{ ctx.row.createdOnTime }}</span>
    </div>
  </ng-container>

  <!-- Status — shows approval value (Approved / Pending / Rejected) -->
  <ng-container *ngIf="ctx.col.key === 'status'">
    <span class="status-badge" [ngClass]="{
      'status-badge--pending':  ctx.row.status === 'In_Progress',
      'status-badge--approved': ctx.row.status === 'Approved',
      'status-badge--rejected': ctx.row.status === 'Rejected'
    }">
      {{ ctx.row.status?.replace('_', ' ') }}
    </span>
  </ng-container>

  <!-- Actions -->
  <ng-container *ngIf="ctx.col.key === 'actions'">
    <app-common-table-actions (view)="onView(ctx.row)" (edit)="onEdit(ctx.row)"
      viewPermission="MYAPPROVAL:HIERARCHYAPPROVALS:VIEW" editPermission="MYAPPROVAL:HIERARCHYAPPROVALS:EDIT" />
  </ng-container>

</ng-template>
