<div class="an-page">

  <div class="an-page-header">
    <div class="an-title-row">
      <app-heading [heading]="'All Notifications'" [subHeading]="'Stay updated on all activities and actions'"
        [showBackButton]="true" [buttonText]="'Back to Notifications'" [backButtonUrl]="'/'"  (backClick)="goBack()"> 
      </app-heading>
      <div class="an-header-actions">
        <button class="an-mark-all-btn" (click)="markAllAsRead()" [disabled]="!hasUnreadRows">
          <i class="fa-regular fa-envelope-open"></i>
          Mark all as read
        </button>
      </div>
    </div>
  </div>

  <div class="an-filter-wrap">
    <app-common-filter [searchPlaceholder]="'Search notifications...'" [dropdowns]="dropdowns"
      (filterChange)="onFilterChange($event)" [tabs]="tabs" (tabChange)="selectTab($event)" [activeTab]="activeTab">
    </app-common-filter>
  </div>

  <!-- ── Selection action bar (visible only when rows are checked) ────────── -->
  <div class="an-selection-bar" *ngIf="selectedCount > 0">
    <span class="an-selection-label">
      <i class="fa-solid fa-circle-check"></i>
      {{ selectedCount }} notification{{ selectedCount > 1 ? 's' : '' }} selected
    </span>
    <button class="an-mark-selected-btn" (click)="markSelectedAsRead()" [disabled]="markingRead">
      <i class="fa-regular fa-envelope-open"></i>
      {{ markingRead ? 'Marking…' : 'Mark as read' }}
    </button>
    <button class="an-clear-btn" (click)="selectedIds.clear()">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <!-- ── Table ─────────────────────────────────────────────────────────────── -->
  <app-reusable-table [columns]="columns" [data]="displayData" [cellTemplate]="customCells" [totalItems]="totalItems"
    [pageSize]="pageSize" [currentPage]="currentPage" [showPagination]="true" [emptyMessage]="'No notifications found'"
    (pageChange)="onPageChange($event)">
  </app-reusable-table>

</div>

<!-- ── Custom Cell Templates ─────────────────────────────────────────────────── -->
<ng-template #customCells let-ctx>

  <!-- ── Checkbox column ─────────────────────────────────────────────────── -->
  <ng-container *ngIf="ctx.col.key === 'checkbox'">

    <!-- Header cell: select-all for unread rows -->
    <ng-container *ngIf="ctx.isHeader; else rowCheckbox">
      <label class="an-checkbox-wrap" *ngIf="hasUnreadRows" title="Select all unread">
        <input type="checkbox" class="an-checkbox" [checked]="allUnreadSelected"
          [indeterminate]="selectedCount > 0 && !allUnreadSelected" (change)="toggleSelectAll()" />
        <span class="an-checkbox-box"></span>
      </label>
    </ng-container>

    <!-- Row cell: shown only for unread rows -->
    <ng-template #rowCheckbox>
      <label class="an-checkbox-wrap" *ngIf="!ctx.row.isRead" (click)="$event.stopPropagation()">
        <input type="checkbox" class="an-checkbox" [checked]="isSelected(ctx.row)" (change)="toggleRow(ctx.row)" />
        <span class="an-checkbox-box"></span>
      </label>
    </ng-template>

  </ng-container>

  <!-- ── Notification column ─────────────────────────────────────────────── -->
  <ng-container *ngIf="ctx.col.key === 'notification'">
    <div class="an-notif-cell">
      <span class="an-unread-dot" *ngIf="!ctx.row.isRead"></span>
      <div class="an-notif-icon" [style.background]="getIconColor(ctx.row.type) + '1a'">
        <i [class]="getIconClass(ctx.row.type)" [style.color]="getIconColor(ctx.row.type)"></i>
      </div>
      <span class="an-notif-title" [class.an-notif-title--unread]="!ctx.row.isRead">
        {{ ctx.row.notification }}
      </span>
    </div>
  </ng-container>
  <ng-container *ngIf="ctx.col.key === 'message'">
    <span class="an-notif-title">
      {{ ctx.row.message }}
    </span>
  </ng-container>
  <!-- ── Related To column ───────────────────────────────────────────────── -->
  <ng-container *ngIf="ctx.col.key === 'relatedId'">
    <div class="an-related-cell">
      <a class="an-related-id" [style.color]="getRelatedColor(ctx.row.relatedDept)">
        {{ ctx.row.relatedId }}
      </a>
      <span class="an-related-dept">{{ ctx.row.relatedDept }}</span>
    </div>
  </ng-container>

  <!-- ── Action column ───────────────────────────────────────────────────── -->
  <ng-container *ngIf="ctx.col.key === 'action'">
    <div class="an-action-group" (click)="$event.stopPropagation()">

      <!-- Mark as Read -->
      <button *ngIf="!ctx.row.isRead" class="an-action-btn an-action-btn--read" (click)="toggleReadStatus(ctx.row)"
        title="Mark as Read">

        <i class="fa-solid fa-circle-check"></i>
      </button>

      <!-- Mark as Unread -->
      <button *ngIf="ctx.row.isRead" class="an-action-btn an-action-btn--unread" (click)="toggleReadStatus(ctx.row)"
        title="Mark as Unread">

        <i class="fa-solid fa-arrow-rotate-left"></i>
      </button>

    </div>
  </ng-container>

</ng-template>
