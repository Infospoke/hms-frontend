<div class="bubble-card">

  <div class="bubble-header">
    <h3>{{ title }}</h3>
  </div>

  <div class="bubble-content">

    <!-- Bubble Chart -->
    <div class="bubble-area">

      <div
        class="bubble"
        *ngFor="let bubble of bubbles"
        [style.width.px]="bubble.size"
        [style.height.px]="bubble.size"
        [style.background]="bubble.color">

        <span class="bubble-value">{{ bubble.value }}</span>
        <span class="bubble-label">{{ bubble.label }}</span>

      </div>

    </div>

    <!-- Table -->
    <div class="source-table">

      <table>

        <thead>
          <tr>
            <th>Source</th>
            <th>Hires</th>
            <th>Cost/Hire</th>
          </tr>
        </thead>

        <tbody>

          <tr *ngFor="let row of tableData">

            <td>{{ row.source }}</td>

            <td>{{ row.hires }}</td>

            <td>{{ row.cost }}</td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>
