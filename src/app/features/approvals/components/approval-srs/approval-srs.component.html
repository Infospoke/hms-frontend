<div class="approval-component">

    <app-approval-layout [heading]="'My SRs — Approval Status'"
        subHeading="Track the progress of all your staffing requisitions" [showInfo]="true"
        infoTooltip="More details about approval status" [cards]="cards"
        [searchPlaceholder]="'Search by SR ID or Job Title'" [dropDownData]="dropDownData" [tabs]="tabs"
        [activeTab]="activeTab" (tabChange)="setTab($event)" (filterChange)="filtersResponse($event)" />

    <div class="">
        <app-reusable-table [columns]="columns" [data]="data" [totalItems]="totalItems" [pageSize]="pageSize"
            [currentPage]="currentPage" [cellTemplate]="cellTpl" emptyMessage="No staffing requisitions found."
            (pageChange)="onPageChange($event)"></app-reusable-table>
    </div>
</div>

<ng-template #cellTpl let-ctx>

    <!-- SR ID -->
    <ng-container *ngIf="ctx.col.key === 'srId'">
        <div class="sr-id-cell">
            <span class="sr-id-link" [title]="ctx.row['srId']">{{ ctx.row['srId'] }}</span>
        </div>
    </ng-container>

    <!-- Job Title — show first 10 chars then ".." -->
    <ng-container *ngIf="ctx.col.key === 'jobTitle'">
        <span [title]="ctx.row['jobTitle']">
            {{ truncate(ctx.row['jobTitle']) }}
        </span>
    </ng-container>

    <!-- Department — show first 10 chars then ".." -->
    <ng-container *ngIf="ctx.col.key === 'department'">
        <span [title]="ctx.row['department']">
            {{ truncate(ctx.row['department']) }}
        </span>
    </ng-container>

    <!-- Current Stage -->
    <ng-container *ngIf="ctx.col.key === 'currentStage'">
        <div class="stage-cell">
            <span class="stage-main">{{ ctx.row['currentStage'] }}</span>
        </div>
    </ng-container>

    <!-- Overall Status -->
    <ng-container *ngIf="ctx.col.key === 'overallStatus'">
        <div class="status-cell">
            <span class="status-badge" [ngClass]="getStatusClass(ctx.row['overallStatus'])">
                {{ ctx.row['overallStatus'] }}
            </span>
        </div>
    </ng-container>

    <!-- Created On -->
    <ng-container *ngIf="ctx.col.key === 'createdOn'">
        <span class="date-text">
            {{ ctx.row['createdOn'] | date:'d MMM yyyy' }}
        </span>
    </ng-container>

    <!-- Actions -->
    <ng-container *ngIf="ctx.col.key === 'actions'">
        <div class="actions-cell">
            <app-common-table-actions (view)="onView(ctx.row)" (edit)="onEdit(ctx.row)"
                viewPermission="MYAPPROVAL:SRAPPROVALS:VIEW" [editPermission]="
                currentUserRole === ctx.row['currentRole'] && ctx.row['overallStatus'] !== 'Rejected'
                    ? 'MYAPPROVAL:SRAPPROVALS:EDIT'
                    : '' "
            />
        </div>
    </ng-container>

</ng-template>
