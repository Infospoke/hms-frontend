<div class="approval-layout">
    <app-approval-layout
    heading="Assigned Interview Requests"
    subHeading="Review and manage interview requests assigned to you."
    [searchPlaceholder]="'Search by Job Title, Department'"
    [dropDownData]="interviewPriority"
    [cards]="cards"
    (filterChange)="onFilterChange($event)"/>

    <app-assigned-interview-requests-table
    [payload]="tablePayload"
    (pageChange)="onPageChange($event)" />
</div>
