<div class="sankey-wrap">
  <svg
    [attr.viewBox]="'0 0 ' + width + ' ' + height"
    preserveAspectRatio="xMidYMid meet"
    class="sankey-svg">
    <path *ngFor="let l of renderLinks" [attr.d]="l.path" [attr.fill]="l.color" fill-opacity="0.32" stroke="none"></path>
    <rect *ngFor="let n of renderNodes; trackBy: trackByNodeId"
      [attr.x]="n.x" [attr.y]="n.y" [attr.width]="n.width" [attr.height]="n.height"
      [attr.fill]="n.color" rx="3"></rect>

    <!-- Inline node labels (only when showLabels=true) -->
    <ng-container *ngIf="showLabels">
      <text *ngFor="let n of renderNodes; trackBy: trackByNodeId"
        [attr.x]="isLastColumn(n.id) ? n.x - 5 : n.x + n.width + 5"
        [attr.text-anchor]="isLastColumn(n.id) ? 'end' : 'start'"
        [attr.y]="n.y + (n.height / 2) + 4"
        font-size="9.5"
        [attr.fill]="n.color"
        font-weight="600"
        font-family="Inter, system-ui, sans-serif">{{ n.label }}: {{ n.value }}</text>
    </ng-container>
  </svg>

  <div class="sankey-legend">
    <div class="sankey-legend-item" *ngFor="let n of nodes; trackBy: trackByNodeId">
      <span class="sankey-legend-dot" [style.background]="n.color"></span>
      <span class="sankey-legend-label">{{ n.label }}</span>
      <span class="sankey-legend-value">{{ n.value }}</span>
    </div>
  </div>
</div>
