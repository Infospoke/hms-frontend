<app-reusable-table
  [columns]="columns"
  [data]="data"
  [sortableColumns]="sortableColumns"
  [showPagination]="showPagination"
  [currentPage]="currentPage"
  [pageSize]="pageSize"
  [totalItems]="totalItems"
  [emptyMessage]="emptyMessage"
  [cellTemplate]="cellTpl"
  tableLayout="fixed"
  (sortChange)="onSortChange($event)"
  (pageChange)="onPageChange($event)">
</app-reusable-table>

<ng-template #cellTpl let-ctx>

  <!-- Candidate: avatar + name + email -->
  <div class="as-candidate" *ngIf="ctx.col.key === 'candidate'">
    <span class="as-avatar" [ngClass]="'as-avatar--' + ctx.row.avatarColor">
      {{ ctx.row.avatarInitials }}
    </span>
    <div class="as-candidate-info">
      <span class="as-candidate-name">{{ ctx.row.name }}</span>
      <span class="as-candidate-email">{{ ctx.row.email }}</span>
    </div>
  </div>

  <!-- Approval status stepper -->
  <div class="as-stepper" *ngIf="ctx.col.key === 'approvalStatus'">
    <ng-container *ngFor="let step of ctx.row.approvalSteps; let last = last">

      <div class="as-step">
        <span class="as-step-icon" [ngClass]="'as-step-icon--' + step.state">

          <!-- Completed: check mark -->
          <svg *ngIf="step.state === 'completed'" width="18" height="18" viewBox="0 0 18 18" fill="none">
            <circle cx="9" cy="9" r="8" stroke="currentColor" stroke-width="1.4" fill="none"/>
            <path d="M5.5 9.2L7.8 11.4L12.5 6.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>

          <!-- Active / pending: person icon -->
          <svg *ngIf="step.state !== 'completed'" width="18" height="18" viewBox="0 0 18 18" fill="none">
            <circle cx="9" cy="9" r="8" stroke="currentColor" stroke-width="1.4" fill="none"/>
            <circle cx="9" cy="7" r="2.3" fill="currentColor"/>
            <path d="M4.3 13.4C5 11.4 6.8 10.1 9 10.1C11.2 10.1 13 11.4 13.7 13.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none"/>
          </svg>

        </span>
        <span class="as-step-label" [ngClass]="'as-step-label--' + step.state">{{ step.label }}</span>
      </div>

      <span class="as-step-dash" *ngIf="!last">-</span>

    </ng-container>
  </div>

  <!-- Priority badge -->
  <span
    class="as-badge"
    [ngClass]="'as-badge--' + ctx.row.priority.toLowerCase()"
    *ngIf="ctx.col.key === 'priority'">
    {{ ctx.row.priority }}
  </span>

  <!-- Action button -->
   <div *appCan="permissionName">
     <button
    type="button"
    class="as-action-btn"
    *ngIf="ctx.col.key === 'actions'"
    (click)="onAction(ctx.row)">
    {{ actionLabel }}
  </button>
   </div>
 

</ng-template>
