<div class="assigned-interview-requests">

  <app-pipeline-stages [stages]="stages" [activeStageId]="activeStageId" (stageSelected)="onStageSelected($event)" />
  <app-heading [heading]="selectedStageMeta?.heading" [subHeading]="selectedStageMeta?.subHeading" />
  <app-common-filter
    *ngIf="showFilter"
    [searchPlaceholder]="searchPlaceholder"
    [dropdowns]="activeFilters"
    (filterChange)="filterChange($event)" />

  <app-today-interview-table
    *ngIf="activeStageId === 'ti'"
    [payload]="tablePayload"
    (pageChange)="onPageChange($event)" />

 

  <app-scheduled-table
    *ngIf="activeStageId === 'ts'"
    [payload]="tablePayload"
    (pageChange)="onPageChange($event)" />

  <app-interview-upcomming-table
    *ngIf="activeStageId === 'ui'"
    [payload]="tablePayload"
    (pageChange)="onPageChange($event)" />

  <app-interview-feedback-table
    *ngIf="activeStageId === 'fp'"
    [payload]="tablePayload"
    (pageChange)="onPageChange($event)" />

</div>
