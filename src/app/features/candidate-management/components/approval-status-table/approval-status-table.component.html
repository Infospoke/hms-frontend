<app-reusable-table
  [columns]="columns"
  [data]="data"
   [title]="heading"
  [subTitle]="subHeading"
  [sortableColumns]="sortableColumns"
  [showPagination]="showPagination"
  [currentPage]="currentPage"
  [pageSize]="pageSize"
  [totalItems]="totalItems"
  [emptyMessage]="emptyMessage"
  [cellTemplate]="cellTpl"
  tableLayout="fixed"
  (sortChange)="onSortChange($event)"
  (pageChange)="onPageChange($event)">
</app-reusable-table>

<ng-template #cellTpl let-ctx>

  <!-- Candidate: avatar + name + email -->
  <div class="as-candidate" *ngIf="ctx.col.key === 'candidate'">
    <span class="as-avatar" [ngClass]="'as-avatar--' + ctx.row.avatarColor">
      {{ ctx.row.avatarInitials }}
    </span>
    <div class="as-candidate-info">
      <span class="as-candidate-name">{{ ctx.row.name }}</span>
      <span class="as-candidate-email">{{ ctx.row.email }}</span>
    </div>
  </div>

  <!-- Recruiter link -->
  <a
    class="as-recruiter-link"
    href="javascript:void(0)"
    *ngIf="ctx.col.key === 'recruiter'">
    {{ ctx.row.recruiter }}
  </a>

  <!-- Status badge -->
  <span
    class="as-status-badge"
    [ngClass]="'as-status-badge--' + ctx.row.status"
    *ngIf="ctx.col.key === 'status'">
    {{ getStatusLabel(ctx.row) }}
  </span>

  <!-- Action button (only rendered when the column is present, e.g. Expired → "Raise new request") -->
  <div *appCan="permissionName">
    <button
      type="button"
      class="as-action-btn"
      *ngIf="ctx.col.key === 'actions'"
      (click)="onAction(ctx.row)">
      {{ actionLabel }}
    </button>
  </div>

</ng-template>
