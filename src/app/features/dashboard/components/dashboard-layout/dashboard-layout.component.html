<div class="main-dashboard-layout">
    <app-heading [heading]="heading" [subHeading]="subHeading" />
    <div class="card-dd">
        <div *ngFor="let item of cards">
            <app-dashboard-count-card [label]="item?.label" [value]="item?.value" [iconClass]="item?.iconClass"
                [iconBgColor]="item?.iconBgColor" [iconColor]="item?.iconColor" [bottomText]="item?.subLabel"
                [trend]="item?.trend" [trendColor]="item?.trendColor ?? '#16A34A'" />
        </div>
    </div>


    <div class="split-row" *ngIf="(table && tableConfig) || (pipeLine && (pipelineGraph || pipelineConfig))">
        <div class="chart-card requisitions-card" *ngIf="table && tableConfig">
            <div class="chart-card-header" *ngIf="tableConfig.title">
                <h3>{{ tableConfig.title }}</h3>
            </div>
            <app-reusable-table [columns]="tableConfig.columns" [data]="tableConfig.data"
                [showHeader]="true" [tableLayout]="'fixed'" [cellTemplate]="reqCell" />
        </div>

        <!-- ApexCharts funnel + conversion-rate circles (self-contained
             dummy data for now) — fully self-styled as its own dark card,
             so it isn't wrapped in .chart-card like the plain pipeline
             below is. -->
        <app-candidate-pipeline-graph class="pipeline-card" *ngIf="pipeLine && pipelineGraph" />

        <div class="chart-card pipeline-card" *ngIf="pipeLine && !pipelineGraph && pipelineConfig">
            <app-candidate-pipeline
                [title]="pipelineConfig.title ?? 'Candidate Pipeline'"
                [periods]="pipelineConfig.periods ?? ['This Month']"
                [selectedPeriod]="pipelineConfig.selectedPeriod ?? (pipelineConfig.periods?.[0] ?? 'This Month')"
                [stages]="pipelineConfig.stages"
                [overallConversionLabel]="pipelineConfig.overallConversionLabel ?? 'Overall Conversion Rate'"
                [overallConversionRate]="pipelineConfig.overallConversionRate ?? 0" />
        </div>
    </div>

    <ng-template #reqCell let-ctx>
        <span *ngIf="ctx.col.key === 'priority'" [class]="priorityClass(ctx.row.priority)">
            {{ ctx.row.priority }}
        </span>
        <span *ngIf="ctx.col.key === 'slaStatus'" [class]="slaClass(ctx.row.slaStatus)">
            {{ ctx.row.slaStatus }}
        </span>
        <span *ngIf="ctx.col.key === 'dueDate'" class="date-cell">
            {{ ctx.row.dueDate }}
        </span>
    </ng-template>

    <div class="grid" *ngIf="pieCharts.length || (showSemiCircle && semiCircleConfig)">
        <div class="chart-card" *ngFor="let chart of pieCharts">
            <div class="chart-card-header" *ngIf="chart.title">
                <h3>{{ chart.title }}</h3>
            </div>
            <app-donut-pie-chart [segments]="chart.segments" [centerLabel]="chart.centerLabel" [size]="chart.size"
                [showCount]="true" />
        </div>

        <div class="chart-card hh-card" *ngIf="showSemiCircle && semiCircleConfig">
            <div class="chart-card-header" *ngIf="semiCircleConfig.title">
                <h3>{{ semiCircleConfig.title }}</h3>
            </div>
            <div class="hh-panel">
                <div class="hh-gauge-col">
                    <app-semi-circle-gauge [score]="semiCircleConfig.score" [size]="100" />
                </div>
                <div class="hh-table-col">
                    <app-reusable-table [columns]="semiCircleConfig.columns" [data]="semiCircleConfig.data"
                        [showHeader]="true" [tableLayout]="'auto'" [cellTemplate]="statusCell" />
                </div>
            </div>
        </div>
    </div>

    <ng-template #statusCell let-ctx>
        <span *ngIf="ctx.col.key === 'status'" [class]="statusClass(ctx.row.status)">
            <span class="dot"></span>
            {{ ctx.row.status }}
        </span>
    </ng-template>
</div>
