<div class="feed-back">

  <app-heading
    heading="Provide Feedback"
    subHeading="Share your feedback and rating for the completed interview."
    [showBackButton]="true"
    backButtonUrl="/"
    buttonText="Back to Feedback Pending"
    (backClick)="handleBack()"
  />

  <!-- ── TOP SUMMARY CARD ──────────────────────────────────────────────── -->
  <section class="card summary-card">

    <!-- Left: Interview Details -->
    <div class="interview-details">
      <div class="interview-title-row">
        <div class="interview-icon">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <rect x="1.5" y="4.5" width="11" height="9" rx="2" stroke="#6366f1" stroke-width="1.4"/>
            <path d="M12.5 7.5l4-2v7l-4-2V7.5z" stroke="#6366f1" stroke-width="1.4" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="interview-label">Interview Details</span>
      </div>

      <div class="detail-list">
        <div class="detail-item">
          <span class="di-label">Interview Type</span>
          <span class="di-value">{{ interview?.type }}</span>
        </div>
        <div class="detail-item">
          <span class="di-label">Job Applied</span>
          <span class="di-value">
            {{ interview?.jobApplied }}
            <span class="job-badge">{{ interview?.jobBadge }}</span>
          </span>
        </div>
        <div class="detail-item">
          <span class="di-label">Completed On</span>
          <div class="di-value date-row">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <rect x="1" y="2" width="12" height="10.5" rx="1.5" stroke="#6b7280" stroke-width="1.1"/>
              <path d="M1 5.5h12" stroke="#6b7280" stroke-width="1.1"/>
              <path d="M4 1v2M10 1v2" stroke="#6b7280" stroke-width="1.1" stroke-linecap="round"/>
            </svg>
            <span>{{ interview?.completedOn | date:'MMM d, y' }}</span>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <circle cx="7" cy="7" r="5.5" stroke="#6b7280" stroke-width="1.1"/>
              <path d="M7 4.5v2.5l1.5 1.5" stroke="#6b7280" stroke-width="1.1" stroke-linecap="round"/>
            </svg>
            <span>{{ interview?.time }}</span>
          </div>
        </div>
        <div class="detail-item">
          <span class="di-label">Venue</span>
          <div class="di-value venue-row">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M7 1C4.8 1 3 2.8 3 5c0 3.2 4 8 4 8s4-4.8 4-8c0-2.2-1.8-4-4-4z" stroke="#6b7280" stroke-width="1.1"/>
              <circle cx="7" cy="5" r="1.5" stroke="#6b7280" stroke-width="1.1"/>
            </svg>
            <span>{{ interview?.venue }}</span>
          </div>
        </div>
        <div class="detail-item">
          <span class="di-label">Interview ID</span>
          <span class="di-value mono">{{ interview?.interviewId }}</span>
        </div>
      </div>
    </div>

    <!-- Vertical divider -->
    <div class="summary-divider"></div>

    <div class="candidate-panel">
      <app-interview-candidate-info
        [candidate]="candidate"
        [tabs]="[]"
        [compact]="true"
      />
    </div>

  </section>

  <!-- ── REUSABLE FEEDBACK FORM ────────────────────────────────────────── -->
  <app-interview-feedback-form
    [competencies]="competencies"
    [initialRating]="existingFeedback?.overallRating ?? 1"
    [showCancel]="true"
    submitLabel="Submit Feedback"
    [readonly]="isReadonly"
    (formSubmit)="onFeedbackSubmit($event)"
    (formCancel)="onFeedbackCancel()"
  />
