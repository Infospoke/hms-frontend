<div
  class="main-dashboard-layout"
  [class.recruiter-dashboard]="dashboardType === 'recruiter'">

    <app-heading
        [heading]="heading"
        [subHeading]="subHeading">
    </app-heading>

    <!-- Cards -->
    <div class="card-dd">
        <div *ngFor="let item of cards">
            <app-dashboard-count-card
                [label]="item?.label"
                [value]="item?.value"
                [iconClass]="item?.iconClass"
                [iconBgColor]="item?.iconBgColor"
                [iconColor]="item?.iconColor"
                [bottomText]="item?.subLabel"
                [trend]="item?.trend"
                [trendColor]="item?.trendColor ?? '#16A34A'">
            </app-dashboard-count-card>
        </div>
    </div>

    <!-- Full Width Table -->
    <div class="chart-card requisitions-card" *ngIf="table && tableConfig">

        <div class="chart-card-header" *ngIf="tableConfig.title">
            <h3>{{ tableConfig.title }}</h3>
        </div>

        <app-reusable-table
            [columns]="tableConfig.columns"
            [data]="tableConfig.data"
            [showHeader]="true"
            [tableLayout]="'fixed'"
            [cellTemplate]="reqCell">
        </app-reusable-table>

    </div>

    <!-- Pipeline + Offer Status -->
    <div class="dashboard-row">

        <div class="chart-card large-card" *ngIf="pipeLine && pipelineConfig">

            <app-candidate-pipeline
                 [layout]="pipelineConfig.layout || 'horizontal'"
                [title]="pipelineConfig.title ?? 'Candidate Pipeline'"
                [periods]="pipelineConfig.periods ?? ['This Month']"
                [selectedPeriod]="pipelineConfig.selectedPeriod ?? (pipelineConfig.periods?.[0] ?? 'This Month')"
                [stages]="pipelineConfig.stages"
                [overallConversionLabel]="pipelineConfig.overallConversionLabel ?? 'Overall Conversion Rate'"
                [overallConversionRate]="pipelineConfig.overallConversionRate ?? 0">
            </app-candidate-pipeline>

        </div>

        <div class="chart-card small-card" *ngIf="pieCharts.length > 0">

            <div class="chart-card-header">
                <h3>{{ pieCharts[0].title }}</h3>
            </div>

            <app-donut-pie-chart
                [segments]="pieCharts[0].segments"
                [centerLabel]="pieCharts[0].centerLabel"
                [size]="pieCharts[0].size"
                [showCount]="true">
            </app-donut-pie-chart>

        </div>

    </div>

    <!-- Negotiation + Source Performance -->
    <div class="dashboard-row">

        <div class="chart-card large-card" *ngIf="pieCharts.length > 1">

            <div class="chart-card-header">
                <h3>{{ pieCharts[1].title }}</h3>
            </div>

            <app-donut-pie-chart
                [segments]="pieCharts[1].segments"
                [centerLabel]="pieCharts[1].centerLabel"
                [size]="pieCharts[1].size"
                [showCount]="true">
            </app-donut-pie-chart>

        </div>

        <div class="chart-card small-card">

            <app-bubble-chart-component
                [title]="bubbleChart.title"
                [bubbles]="bubbleChart.bubbles"
                [tableData]="bubbleChart.tableData">
            </app-bubble-chart-component>

        </div>

    </div>

    <!-- Hiring Health -->
    <div class="chart-card hh-card"
         *ngIf="showSemiCircle && semiCircleConfig">

        <div class="chart-card-header"
             *ngIf="semiCircleConfig.title">

            <h3>{{ semiCircleConfig.title }}</h3>

        </div>

        <div class="hh-panel">

            <div class="hh-gauge-col">
                <app-semi-circle-gauge
                    [score]="semiCircleConfig.score"
                    [size]="100">
                </app-semi-circle-gauge>
            </div>

            <div class="hh-table-col">

                <app-reusable-table
                    [columns]="semiCircleConfig.columns"
                    [data]="semiCircleConfig.data"
                    [showHeader]="true"
                    [tableLayout]="'auto'"
                    [cellTemplate]="statusCell">
                </app-reusable-table>

            </div>

        </div>

    </div>

    <!-- Templates -->

    <ng-template #reqCell let-ctx>

        <span *ngIf="ctx.col.key === 'priority'"
              [class]="priorityClass(ctx.row.priority)">
            {{ ctx.row.priority }}
        </span>

        <span *ngIf="ctx.col.key === 'slaStatus'"
              [class]="slaClass(ctx.row.slaStatus)">
            {{ ctx.row.slaStatus }}
        </span>

        <span *ngIf="ctx.col.key === 'dueDate'"
              class="date-cell">
            {{ ctx.row.dueDate }}
        </span>

    </ng-template>

    <ng-template #statusCell let-ctx>

        <span *ngIf="ctx.col.key === 'status'"
              [class]="statusClass(ctx.row.status)">

            <span class="dot"></span>

            {{ ctx.row.status }}

        </span>

    </ng-template>

</div>
