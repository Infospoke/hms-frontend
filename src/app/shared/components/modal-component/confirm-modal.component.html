<div class="modal-wrapper">

  <!-- Icon -->
  <div class="modal-icon" [ngClass]="config.iconClass">
    <i [class]="config.icon"></i>
  </div>

  <!-- Title -->
  <h3 class="modal-title">{{ config.title }}</h3>

  <!-- Description -->
  <p class="modal-desc">{{ config.desc }}</p>

  <!-- Buttons -->
  <div class="modal-actions">
    <button
      class="btn-primary"
      [ngClass]="config.okClass"
      (click)="onConfirm()"
      [disabled]="loading">
      {{ loading ? 'Please wait...' : config.okLabel }}
    </button>
    <button class="btn-secondary" (click)="onCancel()" [disabled]="loading">
      Cancel
    </button>
  </div>

</div>
